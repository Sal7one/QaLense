name: Verify SDK
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Kotlin tests, Android lint, both APKs and release isolation
        run: >-
          gradle :qalens-core:test :qalens-compose:testDebugUnitTest :qalens-noop:testDebugUnitTest
          :qalens-compose:lintDebug :qalens-android:lintDebug :qalens-navigation-compose:lintDebug
          :qalens-replay:lintDebug :sample-app:assembleDebug :sample-app:assembleRelease
          :sample-app:assembleDebugAndroidTest :sample-app:verifyReleaseIsolation
      - name: External consumer integration
        run: gradle -p integration-tests/consumer assembleDebug assembleRelease verifyReleaseIsolation
      - name: Web reader and CLI regression tests
        run: node web/test/read.test.js
      - name: Backend regression tests
        run: python3 backend/tests/test_backend.py
