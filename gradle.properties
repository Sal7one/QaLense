org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin 2.0.x can't parse JDK 25 (IllegalArgumentException: 25.0.2). Pin the Kotlin compile
# daemon to a supported LTS JDK so the build works on machines where JDK 25 is the system default.
kotlin.daemon.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
kotlin.code.style=official
# Faster builds: parallel module compilation + build cache (safe for this project).
org.gradle.parallel=true
org.gradle.caching=true
